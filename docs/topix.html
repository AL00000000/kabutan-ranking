<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPIX入替確定(推定)</title>
<style>
:root{--bg:#0a0f1c;--panel:#101830;--panel2:#0d1426;--border:#1e2a48;--text:#dbe4f5;
      --muted:#7787a5;--accent:#39c5cf;--up:#ff5b6a;--down:#4da3ff;
      --ma5:#ffd166;--ma25:#39c5cf;--ma75:#9b8cff;--grid:#1a2540}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);min-height:100vh;
     font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:16px 14px 64px}
header.site{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;padding:4px 2px 12px}
header.site h1{font-size:1.15rem;font-weight:700;letter-spacing:.02em}
header.site h1 .dot{color:var(--accent)}
header.site .asof{color:var(--muted);font-size:.8rem}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:10px 13px}
.stat .t{color:var(--muted);font-size:.72rem;margin-bottom:4px}
.stat .v{font-size:1.12rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat .s{color:var(--muted);font-size:.7rem;margin-top:2px}
.stat .v.ok{color:var(--accent)}.stat .v.warn{color:var(--up)}

.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--border);
     border-radius:9px;padding:3px;gap:3px}
.seg button{background:none;border:none;color:var(--muted);cursor:pointer;font:inherit;
            font-size:.84rem;padding:6px 15px;border-radius:6px;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent);color:#04121a;font-weight:700}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--panel);
         border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:12px}
label{color:var(--muted);font-size:.78rem;margin-right:5px}
select,input{background:var(--panel2);color:var(--text);border:1px solid var(--border);
             border-radius:8px;padding:7px 11px;font-size:.86rem;outline:none;font-family:inherit}
select:focus,input:focus{border-color:var(--accent)}
input#q{width:200px}
.spacer{flex:1 1 auto}
.count{color:var(--muted);font-size:.78rem}

.note{border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;
      background:var(--panel2);padding:11px 15px;margin-bottom:12px;font-size:.81rem;
      line-height:1.75;color:var(--muted)}
.note b{color:var(--text)}
.note .warn{color:var(--up)}
details.method{border:1px solid var(--border);border-radius:10px;background:var(--panel2);margin-bottom:12px}
details.method summary{cursor:pointer;padding:10px 15px;color:var(--text);font-size:.84rem;font-weight:600}
details.method .body{padding:0 15px 12px;font-size:.81rem;line-height:1.75;color:var(--muted)}
details.method b{color:var(--text)}
details.method .warn{color:var(--up)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
      padding:10px 11px 8px;border-left-width:3px}
.card.risk-high{border-left-color:#ff9f43;background:linear-gradient(90deg,rgba(255,159,67,.07),transparent 40%)}
.card.risk-mid{border-left-color:#8a7a3a}
.card.risk-low{border-left-color:var(--border)}
.card.risk-none{border-left-color:#5a3a48}
.card.g-near{border-left-color:#ffcb5c;background:linear-gradient(90deg,rgba(255,203,92,.05),transparent 40%)}
.card.g-blocked{border-left-color:#ff5b6a;background:linear-gradient(90deg,rgba(255,91,106,.06),transparent 40%)}
.card.g-keep{border-left-color:#39c5cf;background:linear-gradient(90deg,rgba(57,197,207,.05),transparent 40%)}
.gsep{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:8px 2px 2px;
      color:var(--muted);font-size:.78rem}
.gsep::after{content:"";flex:1;height:1px;background:var(--border)}
.gsep b{color:var(--text);font-weight:700}
.card .hd{display:flex;align-items:baseline;gap:7px;margin-bottom:1px}
.card .cd{color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
.card .nm{font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub{color:var(--muted);font-size:.72rem;margin-bottom:6px;
           display:flex;flex-wrap:wrap;gap:2px 10px}
.card .sub b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.card canvas{display:block;width:100%;height:118px}
.card .rets{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:5px;font-size:.72rem;color:var(--muted)}
.card .rets b{font-variant-numeric:tabular-nums;font-weight:600}
.u{color:var(--up)}.d{color:var(--down)}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.68rem;font-weight:700}
.pill.out{background:#3a1520;color:#ff8a96}
.pill.in{background:#0d3038;color:#5fe0e8}
.pill.near{background:#33280d;color:#ffcb5c}
.pill.risk{background:#3a2a10;color:#ff9f43}
.pill.risk2{background:#241f10;color:#c9ad63}
.pill.keep{background:#0d3038;color:#5fe0e8}
.conf{color:var(--muted);font-size:.71rem;margin-left:auto;white-space:nowrap}
.conf b{font-variant-numeric:tabular-nums}
.conf.hi b{color:#ff9f43}
.bar{position:relative;height:3px;border-radius:2px;background:var(--grid);
     margin-top:3px;width:100%;max-width:120px}
.bar i{position:absolute;left:0;top:0;height:100%;border-radius:2px;background:var(--accent)}
.bar i.ng{background:var(--up)}
details.hold{margin:2px 0 5px}
details.hold summary{cursor:pointer;color:var(--muted);font-size:.71rem;list-style:none}
details.hold summary::-webkit-details-marker{display:none}
details.hold summary::before{content:"▸ ";color:var(--accent)}
details.hold[open] summary::before{content:"▾ "}
details.hold div{display:flex;justify-content:space-between;gap:10px;font-size:.71rem;
  color:var(--muted);padding:1px 0 1px 12px}
details.hold div b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}
.loading{padding:40px;text-align:center;color:var(--muted)}
footer{margin-top:16px;color:var(--muted);font-size:.74rem;line-height:1.7;padding:0 2px}
@media(max-width:640px){input#q{width:100%}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1>TOPIX入替確定(推定)<span class="dot">.</span></h1>
    <span class="asof" id="asof"></span>
  </header>

  <div id="app"><div class="loading">読み込み中…</div></div>

  <footer>
    株価: <a href="https://kabutan.jp/" target="_blank" rel="noopener" style="color:var(--accent)">株探(kabutan.jp)</a>の日足 /
    TOPIXウエイト・選定基準・整理/特別注意銘柄: <a href="https://www.jpx.co.jp/" target="_blank" rel="noopener" style="color:var(--accent)">日本取引所グループ</a>。<br>
    <b>これはJPXの公表値ではなく当サイトの推計です。</b>確定した選定結果は2026年10月7日にJPXが公表します。
    データの正確性は保証されません。投資判断はご自身の責任で行ってください。
  </footer>
</div>

<script>
const OKU = 1e8;
const fmtOku = v => v == null ? "－" : (v/OKU >= 10000
  ? (v/1e12).toFixed(2).replace(/\.?0+$/,"") + "兆円"
  : Math.round(v/OKU).toLocaleString() + "億円");
const fmtPct = v => v == null ? '<b>－</b>'
  : '<b class="' + (v > 0 ? "u" : v < 0 ? "d" : "") + '">' + (v > 0 ? "+" : "") + v.toFixed(1) + "%</b>";
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let DATA = null;
const state = { kind: "add", sort: "float_mktcap", order: "auto", q: "", bars: 120,
                riskOnly: false, only: "all" };
const cache = new Map(), pending = new Map();
let observer = null;

/* ---------------------------------------------------------------- データ */
async function loadGz(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  // GitHub Pages は .gz を Content-Encoding なしで返すので明示的に展開する
  const ds = new DecompressionStream("gzip");
  const txt = await new Response(r.body.pipeThrough(ds)).text();
  return JSON.parse(txt);
}

function sma(a, p) {
  const out = new Array(a.length).fill(null);
  let s = 0;
  for (let i = 0; i < a.length; i++) {
    s += a[i];
    if (i >= p) s -= a[i - p];
    if (i >= p - 1) out[i] = s / p;
  }
  return out;
}

async function loadCode(code) {
  if (cache.has(code)) return cache.get(code);
  if (pending.has(code)) return pending.get(code);
  const p = loadGz("data_topix/codes/" + code + ".json.gz").then(d => {
    if (d && d.c) d.ma = { 5: sma(d.c, 5), 25: sma(d.c, 25), 75: sma(d.c, 75) };
    cache.set(code, d); pending.delete(code); return d;
  }).catch(() => { pending.delete(code); return null; });
  pending.set(code, p);
  return p;
}

/* ------------------------------------------------------------ チャート */
function drawChart(cv, d, nbars) {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  const n = d.c.length, from = Math.max(0, n - nbars), cnt = n - from;
  if (cnt < 2) return;
  let lo = Infinity, hi = -Infinity;
  for (let i = from; i < n; i++) {
    if (d.l[i] != null) lo = Math.min(lo, d.l[i]);
    if (d.h[i] != null) hi = Math.max(hi, d.h[i]);
    for (const p of [5, 25, 75]) { const v = d.ma[p][i]; if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }
  }
  if (!isFinite(lo) || !isFinite(hi) || hi <= lo) return;
  const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;

  const fs = 9;
  g.font = fs + "px ui-monospace, Consolas, monospace";
  const label = v => Math.round(v).toLocaleString("ja-JP");
  const padR = Math.ceil(g.measureText(label(hi)).width) + 7;
  const padT = 6, padB = 6;
  const plotW = Math.max(20, w - padR), plotH = Math.max(10, h - padT - padB);
  const x = i => ((i - from) + 0.5) * (plotW / cnt);
  const y = v => padT + plotH - ((v - lo) / (hi - lo)) * plotH;

  g.strokeStyle = "rgba(120,135,165,.16)"; g.lineWidth = 1;
  g.fillStyle = "#7787a5"; g.textAlign = "left"; g.textBaseline = "alphabetic";
  for (let t = 0; t < 3; t++) {
    const v = lo + (hi - lo) * (t / 2), yy = Math.round(y(v)) + 0.5;
    g.beginPath(); g.moveTo(0, yy); g.lineTo(plotW, yy); g.stroke();
    g.fillText(label(v), plotW + 4, Math.min(Math.max(yy + fs * 0.35, fs), h - 2));
  }

  const bw = plotW / cnt, body = Math.max(1, Math.min(bw * 0.68, 5));
  for (let i = from; i < n; i++) {
    const o = d.o[i], hh = d.h[i], ll = d.l[i], c = d.c[i];
    if (c == null) continue;
    const col = (o == null || c >= o) ? "#ff5b6a" : "#4da3ff";
    const cx = x(i);
    g.strokeStyle = col; g.fillStyle = col;
    if (hh != null && ll != null) {
      g.lineWidth = Math.max(1, body * 0.18);
      g.beginPath(); g.moveTo(cx, y(hh)); g.lineTo(cx, y(ll)); g.stroke();
    }
    if (o != null) {
      const yo = y(o), yc = y(c);
      g.fillRect(cx - body / 2, Math.min(yo, yc), body, Math.max(1, Math.abs(yc - yo)));
    }
  }
  const maCols = { 5: "#ffd166", 25: "#39c5cf", 75: "#9b8cff" };
  for (const p of [5, 25, 75]) {
    g.strokeStyle = maCols[p]; g.lineWidth = 1.1;
    g.beginPath();
    let started = false;
    for (let i = from; i < n; i++) {
      const v = d.ma[p][i];
      if (v == null) { started = false; continue; }
      if (!started) { g.moveTo(x(i), y(v)); started = true; } else g.lineTo(x(i), y(v));
    }
    g.stroke();
  }
}

async function fillCard(el) {
  const d = await loadCode(el.dataset.code);
  const cv = el.querySelector("canvas");
  if (!d || !cv) return;
  drawChart(cv, d, state.bars);
  el.__data = d;
}

function observeCards() {
  if (observer) observer.disconnect();
  observer = new IntersectionObserver(es => {
    for (const e of es) {
      if (!e.isIntersecting) continue;
      observer.unobserve(e.target);
      fillCard(e.target);
    }
  }, { rootMargin: "600px 0px" });
  document.querySelectorAll(".card").forEach(c => observer.observe(c));
}

/* ---------------------------------------------------------------- 一覧 */
function barHtml(v, th) {
  if (v == null || !th) return "";
  const p = Math.max(0, Math.min(1, v / th / 1.5));
  return '<div class="bar"><i class="' + (v >= th ? "" : "ng") + '" style="width:' + (p * 100).toFixed(1) + '%"></i></div>';
}

// group: add=採用 / near=圏外だが当落線上 / blocked=サイズは足りるが入れない
//        out=除外 / keep=継続だが当落線上
const GROUPS = {
  add:     { tab: "add", label: "採用",   pill: "in",   asc: true,
             head: "採用（浮動株時価総額が足切り以上）" },
  near:    { tab: "add", label: "圏外",   pill: "near", asc: false,
             head: "当落線上・圏外（足切りに届かなかったが、推計の誤差で入りうる）" },
  blocked: { tab: "add", label: "対象外", pill: "out",  asc: false,
             head: "サイズは足りているが入れない（母集団外・新規追加見送り）" },
  out:     { tab: "out", label: "除外",   pill: "out",  asc: false,
             head: "除外（浮動株時価総額が足切り未満）" },
  keep:    { tab: "out", label: "継続",   pill: "keep", asc: true,
             head: "当落線上・継続（残る判定だが足切りまで25%以内）" },
};

function cardHtml(r) {
  const add = state.kind === "add";
  const th = add ? DATA.meta.t96 : DATA.meta.t97;
  const g = GROUPS[r.group] || GROUPS[add ? "add" : "out"];
  // 回転率で落ちた候補は「浮動株比率の誤差で入りうる」話ではない(回転率は実測で誤差がない)。
  // サイズ基準の確率を出すと誤解を招くので、落ちた理由をそのままバッジにする。
  const turnFail = add && r.fail && r.fail.indexOf("回転率") >= 0;
  const ipoSrc = add && r.float_src === "IPO売出";      // 浮動株比率をIPOの売出株数から出した
  const fewMon = add && (r.months || 12) < 12;          // 回転率が数ヶ月の年換算
  const badge = turnFail && r.group === "near"
    ? '<span class="pill near">回転率不足</span>'
    : (r.group === "blocked" && r.fail && r.fail.length)
    ? '<span class="pill out">' + esc(r.fail[0]) + "</span>"
    : (!add && r.fail && r.fail.length && r.fail[0].indexOf("母集団外") === 0)
        ? '<span class="pill out">' + esc(r.fail[0]) + "</span>"
        : '<span class="pill ' + g.pill + '">' + g.label + "</span>";
  const meta2 = add
    ? "時価総額 <b>" + fmtOku(r.mktcap) + "</b>　浮動株 <b>" + (r.float_ratio * 100).toFixed(0) + "%</b>" +
      (ipoSrc
        ? '<span class="cd"> (IPOで市場に出た株数ベース)</span>'
        : r.float_ratio_raw
          ? '<span class="cd"> (大株主' + (r.hdate ? " " + esc(r.hdate) : "") + " " +
            (r.float_ratio_raw * 100).toFixed(0) + "%)</span>"
          : "")
    : esc(r.sector || "") + "　ウエイト <b>" + (r.weight == null ? "－" : r.weight.toFixed(4) + "%") + "</b>";
  // 浮動株比率は推計値なので、その根拠(非浮動とみなした大株主)を開いて確かめられるようにする
  const holders = add && r.nonfloat && r.nonfloat.length
    ? '<details class="hold"><summary>非浮動とみなした大株主 計' +
      (r.nonfloat_pct == null ? "－" : r.nonfloat_pct.toFixed(1)) + "%</summary>" +
      r.nonfloat.map(h => '<div><span>' + esc(h.name) + "</span><b>" + h.pct.toFixed(2) + "%</b></div>").join("") +
      "</details>"
    : "";
  const risk = r.risk || "low";
  const confTxt = add
    ? ((r.conf == null || turnFail) ? "" : '<span class="conf' + (risk === "high" ? " hi" : "") + '">' +
        (r.add ? "採用のまま" : "見送りのまま") + ' <b>' + Math.round(r.conf * 100) + "%</b></span>")
    : (r.margin == null ? "" : '<span class="conf' + (risk === "high" ? " hi" : "") +
        '">足切りまで <b>' + ((r.margin - 1) * 100).toFixed(0) + "%</b></span>");
  return '<div class="card risk-' + (turnFail ? "low" : risk) + " g-" + (r.group || "") +
    '" data-code="' + esc(r.code) + '">' +
    '<div class="hd"><span class="cd">' + esc(r.code) + '</span>' +
    '<span class="nm">' + esc(r.name) + "</span>" + badge +
    (r.kanri ? ' <span class="pill near">監理</span>' : "") +
    (ipoSrc ? ' <span class="pill keep">浮動株=IPO売出ベース</span>' : "") +
    (fewMon ? ' <span class="pill near">回転率は' + r.months + 'ヶ月を年換算</span>' : "") +
    (turnFail ? "" : risk === "high" ? ' <span class="pill risk">微妙</span>'
      : risk === "mid" ? ' <span class="pill risk2">やや微妙</span>' : "") +
    confTxt + "</div>" +
    '<div class="sub"><span>' + meta2 + "</span></div>" +
    '<div class="sub"><span>浮動株時価総額 <b>' + fmtOku(r.float_mktcap) + "</b>" + barHtml(r.float_mktcap, th) + "</span>" +
    '<span>年間回転率 <b>' + (r.turnover == null ? "－" : r.turnover.toFixed(2)) + "</b>" +
    barHtml(r.turnover, add ? 0.20 : 0.14) + "</span></div>" +
    holders + "<canvas></canvas>" +
    '<div class="rets"><span>終値 <b>' + (r.close == null ? "－" : r.close.toLocaleString()) + "</b></span>" +
    "<span>1週 " + fmtPct(r.r1w) + "</span><span>1ヶ月 " + fmtPct(r.r1m) + "</span>" +
    "<span>3ヶ月 " + fmtPct(r.r3m) + "</span><span>年初来 " + fmtPct(r.ytd) + "</span></div></div>";
}

const SORTS = [
  { k: "float_mktcap", t: "浮動株時価総額" },
  { k: "turnover", t: "年間売買代金回転率" },
  { k: "close", t: "株価" },
  { k: "r1w", t: "1週騰落率" },
  { k: "r1m", t: "1ヶ月騰落率" },
  { k: "r3m", t: "3ヶ月騰落率" },
  { k: "ytd", t: "年初来騰落率" },
  { k: "code", t: "コード" },
];

// グループの並び順。既定では足切りを挟んで両側が隣り合うように並べる
// (採用は小さい順 → 圏外は大きい順 / 除外は大きい順 → 継続は小さい順)。
const ORDER = { add: ["add", "near", "blocked"], out: ["out", "keep"] };

function groupRows() {
  const src = state.kind === "add" ? DATA.added : DATA.excluded;
  const q = state.q.trim().toLowerCase();
  let rs = q ? src.filter(r => (r.code + " " + r.name).toLowerCase().indexOf(q) >= 0) : src.slice();
  if (state.riskOnly) rs = rs.filter(r => r.risk === "high" || r.risk === "mid");
  const main = state.kind === "add" ? "add" : "out";
  if (state.only === "main") rs = rs.filter(r => r.group === main);
  // 「足切りの前後だけ」: グループを問わず足切りから±35%以内。上場1年未満も常に入れる
  if (state.only === "edge") {
    const th = state.kind === "add" ? DATA.meta.t96 : DATA.meta.t97;
    rs = rs.filter(r => (r.months || 12) < 12 ||
      (r.float_mktcap != null && Math.abs(r.float_mktcap / th - 1) <= 0.35));
  }

  return ORDER[state.kind].map(g => {
    const rows = rs.filter(r => r.group === g);
    const asc = state.order === "auto" ? GROUPS[g].asc : state.order === "asc";
    rows.sort((a, b) => {
      let x = a[state.sort], y = b[state.sort];
      if (state.sort === "code") { x = String(x); y = String(y); }
      if (x == null) x = -Infinity;
      if (y == null) y = -Infinity;
      return x < y ? (asc ? -1 : 1) : x > y ? (asc ? 1 : -1) : 0;
    });
    return { g: g, rows: rows };
  }).filter(x => x.rows.length);
}

function renderGrid() {
  const gs = groupRows();
  const n = gs.reduce((a, x) => a + x.rows.length, 0);
  document.getElementById("grid").innerHTML = n
    ? gs.map(x => '<div class="gsep"><b>' + GROUPS[x.g].label + " " + x.rows.length +
        "銘柄</b>" + GROUPS[x.g].head + "</div>" + x.rows.map(cardHtml).join("")).join("")
    : '<div class="loading">該当する銘柄がありません</div>';
  document.getElementById("cnt").textContent =
    gs.map(x => GROUPS[x.g].label + " " + x.rows.length).join(" / ");
  observeCards();
}
