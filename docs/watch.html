<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>監視銘柄リスト</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root {
  --bg: #0a0f1c;
  --panel: #101830;
  --panel2: #0d1426;
  --border: #1e2a48;
  --text: #dbe4f5;
  --muted: #7787a5;
  --accent: #39c5cf;
  --up: #ff5b6a;
  --down: #4da3ff;
  --ma5: #ffd166;
  --ma25: #39c5cf;
  --ma75: #9b8cff;
  --line: #ff9f43;
  --band-a: rgba(255,255,255,.022);
  --band-b: rgba(57,197,207,.045);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  min-height: 100vh;
}
.wrap { max-width: 1400px; margin: 0 auto; padding: 16px 14px 64px; }

/* ---------- ヘッダー ---------- */
header.site { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 4px 2px 14px; }
header.site h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: .02em; }
header.site h1 .dot { color: var(--accent); }
header.site .asof { color: var(--muted); font-size: .8rem; }

/* ---------- セグメント（リスト / タブ / ボタン群） ---------- */
.seg { display: inline-flex; background: var(--panel2); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 3px; }
.seg button {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font: inherit; font-size: .84rem; padding: 6px 13px; border-radius: 6px; white-space: nowrap;
}
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--panel); color: var(--accent); box-shadow: inset 0 0 0 1px var(--border); }
.seg.lists button.on { color: #04121a; background: var(--accent); box-shadow: none; font-weight: 700; }

.toolbar {
  display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 12px; margin-bottom: 12px;
}
.toolbar .grp { display: flex; align-items: center; gap: 8px; }
.toolbar label { color: var(--muted); font-size: .78rem; }
.spacer { flex: 1 1 auto; }
.count { color: var(--muted); font-size: .78rem; }
.count b { color: var(--text); font-weight: 600; }

/* ---------- フォルダ帯 ---------- */
.band { display: flex; align-items: stretch; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
.band + .band { margin-top: 0; }
.band.tint-a { background: var(--band-a); }
.band.tint-b { background: var(--band-b); }
.band-label {
  flex: none; width: 104px; display: flex; align-items: flex-start; justify-content: center;
  padding: 12px 8px; border-right: 1px solid var(--border);
  background: rgba(0,0,0,.22);
}
.band-label span {
  font-size: .82rem; font-weight: 700; letter-spacing: .06em; color: var(--accent);
  position: sticky; top: 12px; text-align: center; overflow-wrap: anywhere;
}
.band-label .n { display: block; font-size: .68rem; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 3px; }
.band-body { flex: 1 1 auto; min-width: 0; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.band .band { margin-bottom: 0; border-radius: 10px; }
.band .band .band-label { width: 88px; background: rgba(0,0,0,.3); }

/* ---------- カードグリッド ---------- */
.cards { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(var(--cardw), 1fr)); position: relative; }
body[data-size="s"] { --cardw: 156px; --charth: 74px; }
body[data-size="m"] { --cardw: 212px; --charth: 104px; }
body[data-size="l"] { --cardw: 288px; --charth: 148px; }
.card {
  background: var(--panel2); border: 1px solid var(--border); border-radius: 9px;
  padding: 7px 8px 6px; display: flex; flex-direction: column; gap: 3px; cursor: pointer;
}
.card:hover { border-color: var(--accent); }
.card .top { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.card .code { font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.card .name { font-size: .82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .px { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.card .close { font-size: .95rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.card .chg { font-size: .74rem; font-variant-numeric: tabular-nums; }
.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--muted); }

/* 終値と25日移動平均線の比較。線より上なら緑、下なら赤の背景で塗る。
   前日比の赤(--up)/青(--down)とは別物なので、色を分けて混同を避けている。 */
.a25up, .a25down { border-radius: 5px; padding: 1px 5px; }
.a25up { background: rgba(37,150,90,.30); color: #8ff0bc; }
.a25down { background: rgba(200,54,70,.30); color: #ffb3bc; }
td.a25up, td.a25down { border-radius: 0; }
.card canvas { width: 100%; height: var(--charth); display: block; }
.card .legend { display: flex; gap: 8px; font-size: .62rem; color: var(--muted); }
.card .legend i { font-style: normal; }
.card .legend .d5 { color: var(--ma5); }
.card .legend .d25 { color: var(--ma25); }
.card .legend .d75 { color: var(--ma75); }
.card.pending canvas { opacity: .25; }

/* ---------- 騰落率テーブル ---------- */
.tblwrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .82rem; }
th, td { padding: 6px 9px; text-align: right; white-space: nowrap; }
th {
  position: sticky; top: 0; z-index: 2; background: var(--panel);
  color: var(--muted); font-weight: 600; font-size: .74rem; cursor: pointer;
  border-bottom: 1px solid var(--border); user-select: none;
}
th:hover { color: var(--accent); }
th.sorted { color: var(--accent); }
th .arrow { font-size: .62rem; }
td { border-bottom: 1px solid rgba(30,42,72,.55); font-variant-numeric: tabular-nums; }
tbody tr:hover td { background: rgba(57,197,207,.06); }
td.name, th.name, td.folder, th.folder { text-align: left; }
td.name { font-weight: 600; }
td.code, td.folder { color: var(--muted); font-size: .76rem; }
td.pct { position: relative; }
td.pct .bar { position: absolute; right: 0; top: 3px; bottom: 3px; opacity: .16; border-radius: 2px; }
td.pct.up .bar { background: var(--up); }
td.pct.down .bar { background: var(--down); }

/* ---------- 拡大モーダル ---------- */
dialog.zoom {
  border: 1px solid var(--border); border-radius: 14px; background: var(--panel);
  color: var(--text); padding: 0; width: min(940px, 94vw); margin: auto;
}
dialog.zoom::backdrop { background: rgba(4,8,18,.72); }
.zoom-head { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px 8px; flex-wrap: wrap; }
.zoom-head .name { font-size: 1.05rem; font-weight: 700; }
.zoom-head .close { margin-left: auto; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; font: inherit; font-size: .8rem; cursor: pointer; }
.zoom-body { padding: 0 16px 16px; }
.zoom-body canvas { width: 100%; height: min(52vh, 420px); display: block; }
.zoom-lines { font-size: .76rem; color: var(--muted); padding-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 14px; }
.zoom-lines b { color: var(--line); }

.msg { border: 1px solid var(--border); background: var(--panel); border-radius: 12px; padding: 18px 20px; color: var(--muted); font-size: .88rem; line-height: 1.9; }
.msg code { background: var(--panel2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 7px; color: var(--accent); font-size: .85em; }
.msg b { color: var(--text); }

.band .band { border-color: rgba(57,197,207,.28); }

/* ---------- ログイン / 保存状態 ---------- */
.authbar { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.btn {
  background: var(--panel2); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 12px; font: inherit; font-size: .78rem; cursor: pointer;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: #04121a; border-color: var(--accent); font-weight: 700; }
.btn.primary:hover { color: #04121a; filter: brightness(1.08); }
.authbar .who { color: var(--muted); font-size: .76rem; max-width: 30ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.savestat { color: var(--muted); font-size: .74rem; white-space: nowrap; }
.savestat.ok { color: var(--ma25); }
.savestat.err { color: var(--up); }
.uidbox {
  display: none; margin-bottom: 10px; font-size: .78rem; line-height: 1.8;
  border: 1px solid var(--border); background: var(--panel); border-radius: 10px; padding: 10px 12px; color: var(--muted);
}
.uidbox code { background: var(--panel2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 7px; color: var(--accent); user-select: all; }

/* ---------- 編集モード ---------- */
.editonly { display: none !important; }
body.editing .editonly { display: inline-flex !important; }
body.editing .band-label { flex-direction: column; gap: 6px; }
.foldctl { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.foldctl button {
  background: none; border: 1px solid var(--border); color: var(--muted);
  border-radius: 6px; font: inherit; font-size: .66rem; padding: 2px 6px; cursor: pointer; line-height: 1.5;
}
.foldctl button:hover { color: var(--accent); border-color: var(--accent); }

.card .grip {
  display: none; position: absolute; top: 3px; right: 3px; z-index: 2;
  width: 22px; height: 22px; align-items: center; justify-content: center;
  color: var(--muted); font-size: .8rem; cursor: grab; border-radius: 5px;
  background: rgba(10,15,28,.72); touch-action: none;
}
body.editing .card { position: relative; }
body.editing .card .grip { display: flex; }
.card .grip:hover { color: var(--accent); background: var(--panel); }
.card.drag-src { opacity: .3; }

.drag-ghost {
  position: fixed; z-index: 9999; pointer-events: none; opacity: .92;
  box-shadow: 0 10px 28px rgba(0,0,0,.55); border-color: var(--accent) !important;
  transform: rotate(1.5deg); will-change: transform;
}
/* グリッドの子として挿入すると再流動してカーソル下の対象がずれるため、絶対配置で重ねる */
.drop-mark {
  position: absolute; width: 3px; border-radius: 2px; pointer-events: none;
  background: var(--accent); box-shadow: 0 0 8px var(--accent);
}
.cards.drop-in, .band-body.drop-in { outline: 2px dashed var(--accent); outline-offset: 3px; border-radius: 8px; }
.band-label.drop-in { background: var(--accent); }
.band-label.drop-in span, .band-label.drop-in .n { color: #04121a; }
.seg.lists button.drop-in { background: var(--accent); color: #04121a; }
.emptyzone {
  grid-column: 1 / -1; border: 1px dashed var(--border); border-radius: 8px;
  padding: 14px; text-align: center; color: var(--muted); font-size: .76rem;
}
/* 長押しで掴めるようにするため、編集中のカードは選択・長押しメニューを抑える */
body.editing .card { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 12px);
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 999px; padding: 9px 16px; font-size: .8rem; z-index: 10000;
  box-shadow: 0 8px 24px rgba(0,0,0,.5); opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.legendbar {
  display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center;
  margin: 0 0 8px; color: var(--muted); font-size: .72rem;
}
.legendbar .lg { display: inline-flex; align-items: center; gap: 5px; }
.legendbar .sw { width: 13px; height: 13px; border-radius: 4px; padding: 0; }

@media (max-width: 640px) {
  .authbar { width: 100%; margin-left: 0; }
  .authbar .who { max-width: 18ch; }
  body.editing .band-label { width: 74px; }
  body.editing .band-label span { writing-mode: horizontal-tb; text-orientation: mixed; }
  .card .grip { width: 30px; height: 30px; font-size: .95rem; }
}

@media (max-width: 640px) {
  .wrap { padding: 10px 7px 48px; }
  header.site { padding: 2px 2px 8px; gap: 6px 10px; }
  header.site h1 { font-size: 1rem; }
  .toolbar { gap: 6px 8px; padding: 7px 8px; border-radius: 10px; }
  .toolbar label { font-size: .72rem; }
  .seg { padding: 2px; border-radius: 7px; }
  .seg button { font-size: .76rem; padding: 5px 9px; }
  .band-label { width: 28px; padding: 9px 3px; }
  .band-label span { writing-mode: vertical-rl; letter-spacing: .1em; text-orientation: upright; font-size: .76rem; }
  .band-label .n { display: none; }
  .band .band .band-label { width: 24px; }
  .band-body { padding: 6px; gap: 6px; }
  .cards { gap: 6px; }
  .card { padding: 6px; }
  body[data-size="s"] { --cardw: 118px; --charth: 60px; }
  body[data-size="m"] { --cardw: 148px; --charth: 84px; }
  body[data-size="l"] { --cardw: 100%; --charth: 168px; }
}
</style>
</head>
<body data-size="m">
<div class="wrap">

<header class="site">
  <h1><span class="dot">◆</span> 監視銘柄リスト</h1>
  <span class="asof" id="asof"></span>
  <div class="authbar">
    <span class="savestat" id="saveStat">読み込み中…</span>
    <span class="who" id="who" hidden></span>
    <button class="btn primary" id="loginBtn">Googleでログイン</button>
    <button class="btn" id="logoutBtn" hidden>ログアウト</button>
  </div>
</header>

<div class="uidbox" id="uidbox"></div>

<div class="toolbar">
  <div class="grp"><div class="seg lists" id="listSeg"></div></div>
  <div class="grp"><div class="seg" id="tabSeg">
    <button data-tab="chart" class="on">チャート</button>
    <button data-tab="table">騰落率</button>
  </div></div>
  <div class="spacer"></div>
  <div class="grp chart-only"><label>期間</label><div class="seg" id="periodSeg">
    <button data-p="1m">1ヶ月</button>
    <button data-p="3m" class="on">3ヶ月</button>
    <button data-p="6m">6ヶ月</button>
    <button data-p="1y">1年</button>
  </div></div>
  <div class="grp chart-only"><label>大きさ</label><div class="seg" id="sizeSeg">
    <button data-s="s">小</button>
    <button data-s="m" class="on">中</button>
    <button data-s="l">大</button>
  </div></div>
  <div class="grp"><label>並び</label><div class="seg" id="sortSeg">
    <button data-k="reg" class="on">登録順</button>
    <button data-k="pct">騰落率</button>
    <button data-k="code">コード</button>
  </div></div>
  <div class="grp"><label>範囲</label><div class="seg" id="scopeSeg">
    <button data-sc="folder" class="on">フォルダ内</button>
    <button data-sc="all">全体</button>
  </div></div>
  <span class="count" id="count"></span>
  <div class="grp editonly" style="gap:6px">
    <button class="btn" id="addFolderBtn">+ フォルダ</button>
    <button class="btn" id="addListBtn">+ リスト</button>
  </div>
</div>

<div class="legendbar">
  <span class="lg"><i class="sw a25up"></i>終値が25日線より上</span>
  <span class="lg"><i class="sw a25down"></i>終値が25日線より下</span>
  <span class="lg editonly">並べ替え: カードを長押し(PCはそのままドラッグ)、または右上の ⠿ をつまんで移動</span>
</div>

<div id="content"></div>
</div>

<dialog class="zoom" id="zoom">
  <div class="zoom-head">
    <span class="name" id="zName"></span>
    <span class="asof" id="zPx"></span>
    <button class="close" id="zClose">閉じる ✕</button>
  </div>
  <div class="zoom-body">
    <canvas id="zCanvas"></canvas>
    <div class="zoom-lines" id="zLines"></div>
  </div>
</dialog>

<script>
"use strict";
const DIR = "data_watch/";
const BARS = { "1m": 22, "3m": 62, "6m": 124, "1y": 250 };

// margin-call-visualizer と同じ Firebase プロジェクトを再利用する。
// al00000000.github.io は既に承認済みドメインなので追加設定は要らない。
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCItdy5OI11Qc51K92Eh-BdnKf8x9wbVN8",
  authDomain: "margin-call-visualizer.firebaseapp.com",
  projectId: "margin-call-visualizer",
  storageBucket: "margin-call-visualizer.firebasestorage.app",
  messagingSenderId: "499047741056",
  appId: "1:499047741056:web:be43ee7059430fa7e69865",
};
// 単一の共有ドキュメント。誰でも読めて、書けるのはルールで許可した uid だけ。
const DOC_PATH = ["watchlists", "main"];

let auth = null, db = null, currentUser = null, unsubscribe = null;

const state = {
  watchlist: null, names: {}, summary: {}, lines: {},
  listIdx: 0, tab: "chart", period: "3m", size: "m", sortKey: "reg", sortDir: -1, scope: "folder",
  editing: false, source: "file",
};
const cache = new Map();      // code -> 日足データ
const pending = new Map();    // code -> Promise
const $ = (s) => document.querySelector(s);

/* ============================ 読み込み ============================ */
async function getJSON(path, fallback) {
  try {
    const r = await fetch(DIR + path, { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch (e) { return fallback; }
}

let fileWatchlist = null;   // data_watch/watchlist.json(未ログイン時の表示 & 初回移行の種)

async function boot() {
  const [wl, names, summary, lines] = await Promise.all([
    getJSON("watchlist.json", null),
    getJSON("names.json", {}),
    getJSON("summary.json", { stocks: {} }),
    getJSON("lines.json", { lines: {} }),
  ]);
  fileWatchlist = normalizeWatchlist(wl);
  state.names = names || {};
  state.summary = (summary && summary.stocks) || {};
  state.lines = (lines && lines.lines) || {};
  $("#asof").textContent = summary && summary.date ? "最終更新 " + summary.date : "";

  bindControls();
  bindAuthUI();
  applyWatchlist(fileWatchlist, "file");
  initFirebase();
}

/** 構造を正規化する(codes/folders の欠損を埋める)。 */
function normalizeWatchlist(wl) {
  if (!wl || !Array.isArray(wl.lists)) return null;
  const node = (n) => {
    n.codes = Array.isArray(n.codes) ? n.codes.filter((c) => typeof c === "string") : [];
    n.folders = Array.isArray(n.folders) ? n.folders : [];
    n.folders.forEach(node);
    return n;
  };
  wl.lists.forEach(node);
  return { version: wl.version || 1, lists: wl.lists };
}

function applyWatchlist(wl, source) {
  state.source = source;
  if (!wl || !wl.lists.length) {
    state.watchlist = null;
    $("#content").innerHTML = '<div class="msg"><b>監視リストがまだありません。</b><br>'
      + 'ログインして <b>+ リスト</b> から作るか、'
      + '<code>py watchlist.py mklist 狙い株</code> で作成してください。</div>';
    $("#listSeg").innerHTML = "";
    $("#count").textContent = "";
    return;
  }
  state.watchlist = wl;
  if (state.listIdx >= wl.lists.length) state.listIdx = 0;
  buildListSeg();
  render();
}

/* ============================ Firebase ============================ */
function initFirebase() {
  if (typeof firebase === "undefined") {
    setSave("オフライン(閲覧のみ)", "err");
    return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.firestore();

  // リダイレクト方式でログインした直後の結果を拾う
  auth.getRedirectResult().catch(() => {});

  auth.onAuthStateChanged((user) => {
    currentUser = user;
    $("#loginBtn").hidden = !!user;
    $("#logoutBtn").hidden = !user;
    $("#who").hidden = !user;
    $("#who").textContent = user ? (user.email || "") : "";
    state.editing = !!user;
    document.body.classList.toggle("editing", state.editing);
    if (state.editing) {
      // 並べ替えは配列順に対応するため、編集中は登録順・フォルダ表示に固定する
      state.sortKey = "reg";
      state.scope = "folder";
      syncSegTo("#sortSeg", "k", "reg");
      syncSegTo("#scopeSeg", "sc", "folder");
    }
    showUidBox(user);
    watchRemote();
  });
}

/** 共有ドキュメントを購読する。複数端末に即時反映される。 */
function watchRemote() {
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }
  if (!db) return;
  setSave("同期中…");
  unsubscribe = db.collection(DOC_PATH[0]).doc(DOC_PATH[1]).onSnapshot(
    (doc) => {
      if (doc.exists) {
        const wl = normalizeWatchlist(doc.data());
        if (wl && wl.lists.length) {
          applyWatchlist(wl, "cloud");
          setSave(currentUser ? "クラウドに自動保存されます" : "クラウドと同期(閲覧のみ)", "ok");
          return;
        }
      }
      // クラウドが空: ログイン済みなら現在のファイル内容を引き継ぐ
      if (currentUser && fileWatchlist) {
        saveRemote(fileWatchlist, true);
      } else {
        applyWatchlist(fileWatchlist, "file");
        setSave("ログインするとクラウドに保存されます");
      }
    },
    () => {
      applyWatchlist(fileWatchlist, "file");
      setSave("クラウドに接続できません(閲覧のみ)", "err");
    }
  );
}

let saveTimer = null;
function scheduleSave() {
  if (!currentUser) return;
  setSave("保存中…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveRemote(state.watchlist, false), 500);
}

async function saveRemote(wl, isSeed) {
  if (!db || !currentUser) return;
  try {
    await db.collection(DOC_PATH[0]).doc(DOC_PATH[1]).set({
      version: wl.version || 1,
      lists: JSON.parse(JSON.stringify(wl.lists)),
      updated: new Date().toISOString(),
      updatedBy: currentUser.uid,
    });
    setSave(isSeed ? "現在の内容をクラウドに移行しました" : "クラウドに自動保存されます", "ok");
  } catch (e) {
    const denied = e && (e.code === "permission-denied" || /permission/i.test(e.message || ""));
    setSave(denied ? "書き込み権限がありません(ルール未設定)" : "保存に失敗しました", "err");
  }
}

function setSave(msg, cls) {
  const el = $("#saveStat");
  el.textContent = msg;
  el.className = "savestat" + (cls ? " " + cls : "");
}

/** ルール設定に必要な uid を、ログイン直後に本人へ提示する。 */
function showUidBox(user) {
  const box = $("#uidbox");
  if (!user) { box.style.display = "none"; return; }
  box.style.display = "block";
  box.innerHTML = 'あなたの uid: <code>' + escapeHTML(user.uid) + "</code>"
    + '<br>この uid を Firestore のセキュリティルールに設定すると、この端末から編集できるようになります。'
    + ' <button class="btn" id="uidHide" style="margin-left:6px">閉じる</button>';
  $("#uidHide").onclick = () => { box.style.display = "none"; };
}

function bindAuthUI() {
  $("#loginBtn").onclick = async () => {
    if (!auth) return;
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
      await auth.signInWithPopup(provider);
    } catch (e) {
      // スマホやアプリ内ブラウザではポップアップが塞がれるためリダイレクトへ切り替える
      const code = (e && e.code) || "";
      if (/popup|cancelled|blocked/i.test(code)) {
        auth.signInWithRedirect(provider);
      } else {
        setSave("ログインに失敗しました", "err");
      }
    }
  };
  $("#logoutBtn").onclick = () => { if (confirm("ログアウトしますか？")) auth.signOut(); };
}

/* ============================ 部品 ============================ */
function curList() { return state.watchlist ? state.watchlist.lists[state.listIdx] : null; }

function nameOf(code) {
  const s = state.summary[code];
  return (s && s.name) || state.names[code] || code;
}

function countCodes(node) {
  let n = (node.codes || []).length;
  for (const f of node.folders || []) n += countCodes(f);
  return n;
}

/** リストを「帯」の木に分解する。帯 = { label, codes, children, path }
 *  path はリスト直下を [] とし、folders のインデックスを連ねたもの。DnDの移動先指定に使う。 */
function bandOf(folder, path) {
  return {
    label: folder.name,
    codes: (folder.codes || []).slice(),
    children: (folder.folders || []).map((f, i) => bandOf(f, path.concat(i))),
    path,
  };
}

function toBands(list) {
  const bands = [];
  const hasFolders = (list.folders || []).length > 0;
  // 編集中は空でもドロップ先として残す
  if ((list.codes || []).length || state.editing) {
    bands.push({ label: hasFolders ? "未分類" : null, codes: (list.codes || []).slice(), children: [], path: [] });
  }
  for (const [i, f] of (list.folders || []).entries()) bands.push(bandOf(f, [i]));
  if (state.editing) return bands;
  return bands.filter((b) => b.codes.length || b.children.length);
}

/** path をたどって実体ノードを返す。 */
function nodeAt(list, path) {
  let n = list;
  for (const i of path) n = n.folders[i];
  return n;
}

/** 帯とその配下すべての銘柄を平らに並べる */
function flatten(band) {
  const out = band.codes.slice();
  for (const c of band.children || []) out.push(...flatten(c));
  return out;
}

function sortCodes(codes) {
  const k = state.sortKey;
  if (k === "reg") return codes;
  const arr = codes.slice();
  if (k === "code") { arr.sort((a, b) => a.localeCompare(b)); return arr; }
  arr.sort((a, b) => {
    const pa = state.summary[a] && state.summary[a].pct, pb = state.summary[b] && state.summary[b].pct;
    if (pa == null && pb == null) return 0;
    if (pa == null) return 1;
    if (pb == null) return -1;
    return (pb - pa) * (state.sortDir < 0 ? 1 : -1);
  });
  return arr;
}

const fmt = (v, d) => v == null ? "—" : v.toLocaleString("ja-JP", { minimumFractionDigits: d || 0, maximumFractionDigits: d == null ? 1 : d });
const pctText = (v) => v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(2) + "%";
const dirClass = (v) => v == null ? "flat" : v > 0 ? "up" : v < 0 ? "down" : "flat";
/** 終値が25日移動平均線より上か下か。銘柄名・コードの背景色に使う。 */
const a25Class = (v) => v == null ? "" : v > 0 ? " a25up" : v < 0 ? " a25down" : "";
const a25Title = (s) => s.ma25 == null ? "25日線を出すには日足が25本必要です"
  : "25日線 " + fmt(s.ma25) + "(乖離 " + pctText(s.vs25) + ")";

/* ============================ 描画（一覧） ============================ */
function render() {
  const list = curList();
  const content = $("#content");
  content.innerHTML = "";
  if (!list) return;
  document.querySelectorAll(".chart-only").forEach((e) => { e.style.display = state.tab === "chart" ? "" : "none"; });

  let bands = toBands(list);
  if (state.scope === "all") {
    const all = [];
    for (const b of bands) all.push(...flatten(b));
    bands = [{ label: null, codes: all, children: [], path: [] }];
  }
  $("#count").innerHTML = "<b>" + countCodes(list) + "</b> 銘柄";

  const dnd = state.editing && state.tab === "chart" && state.scope === "folder";
  let tint = 0;
  const renderBand = (band, depth) => {
    const { sec, body } = bandShell(band, tint++, depth);
    const codes = sortCodes(band.codes);
    if (state.tab === "chart") {
      // 編集中は空でもグリッドを置き、ドロップ先として機能させる
      if (codes.length || dnd) body.appendChild(cardGrid(codes, dnd));
    } else if (codes.length) {
      body.appendChild(dataTable(codes));
    }
    for (const child of band.children || []) body.appendChild(renderBand(child, depth + 1));
    return sec;
  };
  for (const band of bands) content.appendChild(renderBand(band, 0));
  observeCards();
}

function bandShell(band, i, depth) {
  const sec = document.createElement("section");
  sec.className = "band " + (i % 2 ? "tint-b" : "tint-a");
  sec.dataset.depth = depth;
  sec.dataset.path = JSON.stringify(band.path || []);
  const isFolder = (band.path || []).length > 0;
  if (band.label) {
    const lab = document.createElement("div");
    lab.className = "band-label";
    lab.innerHTML = "<span>" + escapeHTML(band.label)
      + '<i class="n">' + flatten(band).length + "</i></span>";
    if (state.editing && isFolder) {
      const ctl = document.createElement("div");
      ctl.className = "foldctl editonly";
      ctl.innerHTML = '<button data-act="ren" title="名前を変更">✎</button>'
        + '<button data-act="sub" title="サブフォルダを作る">＋</button>'
        + '<button data-act="del" title="フォルダを削除">🗑</button>';
      ctl.querySelectorAll("button").forEach((b) => {
        b.onclick = (ev) => { ev.stopPropagation(); folderAction(b.dataset.act, band.path); };
      });
      lab.appendChild(ctl);
    }
    sec.appendChild(lab);
  }
  const body = document.createElement("div");
  body.className = "band-body";
  sec.appendChild(body);
  return { sec, body };
}

function cardGrid(codes, dnd) {
  const grid = document.createElement("div");
  grid.className = "cards";
  for (const code of codes) grid.appendChild(card(code, dnd));
  if (dnd && !codes.length) {
    const z = document.createElement("div");
    z.className = "emptyzone";
    z.textContent = "ここに銘柄をドロップ";
    grid.appendChild(z);
  }
  return grid;
}

function card(code, dnd) {
  const s = state.summary[code] || {};
  const el = document.createElement("article");
  el.className = "card pending";
  el.dataset.code = code;
  el.innerHTML =
    '<div class="top" title="' + escapeHTML(a25Title(s)) + '">'
    + '<span class="code' + a25Class(s.vs25) + '">' + code + '</span>'
    + '<span class="name' + a25Class(s.vs25) + '">' + escapeHTML(nameOf(code)) + '</span></div>'
    + '<div class="px"><span class="close">' + fmt(s.close) + '</span>'
    + '<span class="chg ' + dirClass(s.pct) + '">' + (s.chg == null ? "" : (s.chg > 0 ? "+" : "") + fmt(s.chg)) + " " + pctText(s.pct) + '</span></div>'
    + '<canvas></canvas>'
    + '<div class="legend"><i class="d5">5日</i><i class="d25">25日</i><i class="d75">75日</i></div>';
  el.addEventListener("click", () => { if (!justDragged) openZoom(code); });
  if (dnd) {
    const grip = document.createElement("div");
    grip.className = "grip";
    grip.textContent = "⠿";
    grip.title = "ドラッグして移動";
    grip.addEventListener("pointerdown", (e) => beginDrag(e, el, "instant"));
    el.appendChild(grip);
    // カード本体からも掴める。マウスは少し動かしたら、指/ペンは長押しで。
    el.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse") {
        if (e.button === 0) beginDrag(e, el, "move");
      } else {
        beginDrag(e, el, "hold");
      }
    });
  } else if (state.tab === "chart") {
    el.addEventListener("pointerdown", (e) => { if (e.isPrimary) armDragHint(e, el); });
  }
  return el;
}

/* ============================ 描画（騰落率） ============================ */
const COLS = [
  { k: "code", t: "コード", cls: "code" },
  { k: "name", t: "銘柄名", cls: "name" },
  { k: "close", t: "終値" },
  { k: "chg", t: "前日比" },
  { k: "pct", t: "前日比%" },
  { k: "r1w", t: "1週" },
  { k: "r1m", t: "1ヶ月" },
  { k: "r3m", t: "3ヶ月" },
  { k: "r6m", t: "6ヶ月" },
  { k: "r1y", t: "1年" },
  { k: "rytd", t: "年初来" },
  { k: "rank", t: "代金順位" },
];
let tblSort = { k: "pct", dir: -1 };

function dataTable(bandCodes) {
  const wrap = document.createElement("div");
  wrap.className = "tblwrap";
  const t = document.createElement("table");

  const head = COLS.map((c) =>
    '<th class="' + (c.cls || "") + (tblSort.k === c.k ? " sorted" : "") + '" data-k="' + c.k + '">'
    + c.t + (tblSort.k === c.k ? ' <span class="arrow">' + (tblSort.dir < 0 ? "▼" : "▲") + "</span>" : "") + "</th>").join("");

  const codes = bandCodes.slice().sort((a, b) => {
    const A = state.summary[a] || {}, B = state.summary[b] || {};
    let va = tblSort.k === "name" ? nameOf(a) : tblSort.k === "code" ? a : A[tblSort.k];
    let vb = tblSort.k === "name" ? nameOf(b) : tblSort.k === "code" ? b : B[tblSort.k];
    if (va == null) return 1;
    if (vb == null) return -1;
    if (typeof va === "string") return va.localeCompare(vb) * (tblSort.dir < 0 ? -1 : 1);
    return (va - vb) * (tblSort.dir < 0 ? -1 : 1);
  });

  const rows = codes.map((code) => {
    const s = state.summary[code] || {};
    const cell = (v, isPct) => {
      if (!isPct) return "<td>" + (v == null ? "—" : fmt(v)) + "</td>";
      const w = v == null ? 0 : Math.min(Math.abs(v) * 4, 100);
      return '<td class="pct ' + dirClass(v) + '"><span class="bar" style="width:' + w + '%"></span>' + pctText(v) + "</td>";
    };
    const a25 = a25Class(s.vs25), a25t = ' title="' + escapeHTML(a25Title(s)) + '"';
    return "<tr>"
      + '<td class="code' + a25 + '"' + a25t + ">" + code + "</td>"
      + '<td class="name' + a25 + '"' + a25t + ">" + escapeHTML(nameOf(code)) + "</td>"
      + "<td>" + fmt(s.close) + "</td>"
      + '<td class="' + dirClass(s.chg) + '">' + (s.chg == null ? "—" : (s.chg > 0 ? "+" : "") + fmt(s.chg)) + "</td>"
      + cell(s.pct, true) + cell(s.r1w, true) + cell(s.r1m, true) + cell(s.r3m, true)
      + cell(s.r6m, true) + cell(s.r1y, true) + cell(s.rytd, true)
      + "<td>" + (s.rank == null ? "—" : s.rank) + "</td>"
      + "</tr>";
  }).join("");

  t.innerHTML = "<thead><tr>" + head + "</tr></thead><tbody>" + rows + "</tbody>";
  t.querySelectorAll("th").forEach((th) => {
    th.onclick = () => {
      const k = th.dataset.k;
      if (tblSort.k === k) tblSort.dir *= -1; else { tblSort.k = k; tblSort.dir = -1; }
      render();
    };
  });
  wrap.appendChild(t);
  return wrap;
}

/* ============================ データ取得（遅延） ============================ */
let observer = null;
function observeCards() {
  if (observer) observer.disconnect();
  if (state.tab !== "chart") return;
  observer = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      observer.unobserve(e.target);
      fillCard(e.target);
    }
  }, { rootMargin: "500px 0px" });
  document.querySelectorAll(".card").forEach((c) => observer.observe(c));
}

async function loadCode(code) {
  if (cache.has(code)) return cache.get(code);
  if (pending.has(code)) return pending.get(code);
  const p = getJSON("codes/" + code + ".json", null).then((d) => {
    if (d && d.c) { d.ma = { 5: sma(d.c, 5), 25: sma(d.c, 25), 75: sma(d.c, 75) }; }
    cache.set(code, d);
    pending.delete(code);
    return d;
  });
  pending.set(code, p);
  return p;
}

async function fillCard(el) {
  const code = el.dataset.code;
  const d = await loadCode(code);
  el.classList.remove("pending");
  if (!d) { el.querySelector("canvas").replaceWith(noData()); return; }
  if (!state.summary[code]) patchFromBars(el, d);
  drawChart(el.querySelector("canvas"), d, BARS[state.period], state.lines[code], false);
}

function noData() {
  const s = document.createElement("div");
  s.className = "legend";
  s.style.height = "var(--charth)";
  s.style.display = "flex";
  s.style.alignItems = "center";
  s.textContent = "データ未取得";
  return s;
}

/** summary.json が無い銘柄は日足から終値・前日比を出す */
function patchFromBars(el, d) {
  const n = d.c.length;
  if (!n) return;
  const close = d.c[n - 1], prev = n > 1 ? d.c[n - 2] : null;
  const pct = prev ? (close / prev - 1) * 100 : null;
  el.querySelector(".close").textContent = fmt(close);
  const chg = el.querySelector(".chg");
  chg.className = "chg " + dirClass(pct);
  chg.textContent = (prev == null ? "" : (close - prev > 0 ? "+" : "") + fmt(close - prev)) + " " + pctText(pct);
}

function sma(arr, n) {
  const out = new Array(arr.length).fill(null);
  let sum = 0, cnt = 0;
  for (let i = 0; i < arr.length; i++) {
    const v = arr[i];
    if (v == null) { continue; }
    sum += v; cnt++;
    if (cnt > n) { /* 欠損があっても概ね正しく保つ */ }
    if (i >= n) { const old = arr[i - n]; if (old != null) { sum -= old; cnt--; } }
    if (cnt >= n) out[i] = sum / n;
  }
  return out;
}

/* ============================ ローソク足描画 ============================ */
function drawChart(cv, d, nbars, lines, big) {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  const n = d.c.length;
  const from = Math.max(0, n - nbars);
  const cnt = n - from;
  if (cnt < 2) return;

  let lo = Infinity, hi = -Infinity;
  for (let i = from; i < n; i++) {
    if (d.l[i] != null) lo = Math.min(lo, d.l[i]);
    if (d.h[i] != null) hi = Math.max(hi, d.h[i]);
    for (const p of [5, 25, 75]) { const v = d.ma[p][i]; if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }
  }
  for (const ln of lines || []) { if (ln.price >= lo * 0.9 && ln.price <= hi * 1.1) { lo = Math.min(lo, ln.price); hi = Math.max(hi, ln.price); } }
  if (!isFinite(lo) || !isFinite(hi) || hi <= lo) return;
  const pad = (hi - lo) * 0.06;
  lo -= pad; hi += pad;

  // 価格ラベルの実寸から右余白を決める(桁数で切れないように)
  const fs = big ? 11 : 9;
  g.font = fs + "px ui-monospace, Consolas, monospace";
  const label = (v) => Math.round(v).toLocaleString("ja-JP");
  const padR = Math.ceil(g.measureText(label(hi)).width) + 7;
  const padT = big ? 10 : 7, padB = big ? 20 : 7;
  const plotW = Math.max(20, w - padR), plotH = Math.max(10, h - padT - padB);

  const x = (i) => ((i - from) + 0.5) * (plotW / cnt);
  const y = (v) => padT + plotH - ((v - lo) / (hi - lo)) * plotH;

  // 目盛り
  g.strokeStyle = "rgba(120,135,165,.16)"; g.lineWidth = 1;
  g.fillStyle = "#7787a5"; g.textAlign = "left"; g.textBaseline = "alphabetic";
  const ticks = big ? 5 : 3;
  for (let t = 0; t < ticks; t++) {
    const v = lo + (hi - lo) * (t / (ticks - 1));
    const yy = Math.round(y(v)) + 0.5;
    g.beginPath(); g.moveTo(0, yy); g.lineTo(plotW, yy); g.stroke();
    const ly = Math.min(Math.max(yy + fs * 0.35, fs), h - 2);
    g.fillText(label(v), plotW + 4, ly);
  }

  // ローソク足
  const bw = plotW / cnt;
  const body = Math.max(1, Math.min(bw * 0.68, big ? 9 : 5));
  for (let i = from; i < n; i++) {
    const o = d.o[i], hh = d.h[i], ll = d.l[i], c = d.c[i];
    if (c == null) continue;
    const up = o == null ? true : c >= o;
    const col = up ? "#ff5b6a" : "#4da3ff";
    const cx = x(i);
    g.strokeStyle = col; g.fillStyle = col;
    if (hh != null && ll != null) {
      g.lineWidth = Math.max(1, body * 0.18);
      g.beginPath(); g.moveTo(cx, y(hh)); g.lineTo(cx, y(ll)); g.stroke();
    }
    if (o != null) {
      const yo = y(o), yc = y(c);
      const top = Math.min(yo, yc), hgt = Math.max(1, Math.abs(yc - yo));
      g.fillRect(cx - body / 2, top, body, hgt);
    }
  }

  // 移動平均
  const maCols = { 5: "#ffd166", 25: "#39c5cf", 75: "#9b8cff" };
  for (const p of [5, 25, 75]) {
    g.strokeStyle = maCols[p]; g.lineWidth = big ? 1.6 : 1.1;
    g.beginPath();
    let started = false;
    for (let i = from; i < n; i++) {
      const v = d.ma[p][i];
      if (v == null) { started = false; continue; }
      if (!started) { g.moveTo(x(i), y(v)); started = true; } else g.lineTo(x(i), y(v));
    }
    g.stroke();
  }

  // 意識するライン
  for (const ln of lines || []) {
    const yy = y(ln.price);
    if (yy < padT - 2 || yy > padT + plotH + 2) continue;
    g.strokeStyle = ln.color || "#ff9f43"; g.lineWidth = 1;
    g.setLineDash([4, 3]);
    g.beginPath(); g.moveTo(0, yy); g.lineTo(plotW, yy); g.stroke();
    g.setLineDash([]);
    if (big && ln.label) { g.fillStyle = ln.color || "#ff9f43"; g.fillText(ln.label, 4, yy - 4); }
  }

  // 日付（拡大時のみ）
  if (big) {
    g.fillStyle = "#7787a5"; g.textAlign = "center";
    const step = Math.max(1, Math.floor(cnt / 6));
    for (let i = from; i < n; i += step) {
      const s = String(d.d[i]), cx = x(i);
      g.textAlign = cx < 26 ? "left" : cx > plotW - 26 ? "right" : "center";
      g.fillText(s.slice(4, 6) + "/" + s.slice(6, 8), Math.min(Math.max(cx, 0), plotW), h - 5);
    }
    g.textAlign = "left";
  }
}

/* ============================ 拡大表示 ============================ */
async function openZoom(code) {
  const d = await loadCode(code);
  if (!d) return;
  const s = state.summary[code] || {};
  $("#zName").textContent = code + "  " + nameOf(code);
  $("#zPx").innerHTML = s.close == null ? "" :
    fmt(s.close) + ' <span class="' + dirClass(s.pct) + '">' + pctText(s.pct) + "</span>";
  const lines = state.lines[code] || [];
  $("#zLines").innerHTML = lines.length
    ? lines.map((l) => "<span><b>" + fmt(l.price) + "円</b> " + escapeHTML(l.label || "") + "</span>").join("")
    : '<span>ラインなし（<code>py watchlist.py line add ' + code + ' 価格 --label ラベル</code> で追加）</span>';
  const dlg = $("#zoom");
  dlg.showModal();
  requestAnimationFrame(() => drawChart($("#zCanvas"), d, BARS["1y"], lines, true));
}

/* ============================ 操作 ============================ */
function buildListSeg() {
  const seg = $("#listSeg");
  if (!state.watchlist) { seg.innerHTML = ""; return; }
  seg.innerHTML = state.watchlist.lists.map((l, i) =>
    '<button data-i="' + i + '"' + (i === state.listIdx ? ' class="on"' : "") + ">"
    + escapeHTML(l.name) + "</button>").join("");
  seg.querySelectorAll("button").forEach((b) => {
    b.onclick = () => { state.listIdx = +b.dataset.i; syncSeg(seg, b); render(); };
    b.ondblclick = () => {
      if (!state.editing) return;
      const l = state.watchlist.lists[+b.dataset.i];
      const name = prompt("リスト名", l.name);
      if (name && name.trim()) { l.name = name.trim(); commit(); }
    };
  });
}

function syncSeg(seg, btn) {
  seg.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === btn));
}

function syncSegTo(sel, attr, val) {
  const seg = $(sel);
  if (!seg) return;
  seg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset[attr] === val));
}

function bindControls() {
  const bind = (sel, fn) => {
    const seg = $(sel);
    seg.querySelectorAll("button").forEach((b) => {
      b.onclick = () => { syncSeg(seg, b); fn(b); render(); };
    });
  };
  bind("#tabSeg", (b) => { state.tab = b.dataset.tab; });
  bind("#periodSeg", (b) => { state.period = b.dataset.p; });
  bind("#sizeSeg", (b) => { state.size = b.dataset.s; document.body.dataset.size = b.dataset.s; });
  bind("#sortSeg", (b) => {
    if (state.sortKey === b.dataset.k && b.dataset.k === "pct") state.sortDir *= -1;
    state.sortKey = b.dataset.k;
  });
  bind("#scopeSeg", (b) => { state.scope = b.dataset.sc; });
  $("#zClose").onclick = () => $("#zoom").close();
  $("#addFolderBtn").onclick = addFolder;
  $("#addListBtn").onclick = addList;
  let t = null;
  window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(redrawVisible, 200); });
}

function redrawVisible() {
  document.querySelectorAll(".card").forEach((el) => {
    const d = cache.get(el.dataset.code);
    const cv = el.querySelector("canvas");
    if (d && cv) drawChart(cv, d, BARS[state.period], state.lines[el.dataset.code], false);
  });
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ============================ ドラッグ&ドロップ ============================
   HTML5のDnD APIはタッチ端末で動かないため Pointer Events で実装する。
   掴み方は3通り:
     instant … グリップ(⠿)を押した瞬間から掴む
     move    … マウスでカード本体を5px動かしたら掴む(クリックでの拡大と両立させるため)
     hold    … 指/ペンでカード本体を長押ししたら掴む。長押し中に動いたら
               普通のスクロールとみなして掴まない                        */
const HOLD_MS = 320;      // 長押しと判定するまでの時間
const HOLD_SLOP = 10;     // 長押し待ちの間に許す指のブレ(px)
let drag = null;
let justDragged = false;

// 掴んでいる間だけページのスクロールを止める。タッチ開始前から登録しておかないと
// ブラウザがスクロールを確定させてしまい preventDefault が効かなくなる。
document.addEventListener("touchmove", (e) => {
  if (drag && drag.started) e.preventDefault();
}, { passive: false });

function beginDrag(e, cardEl, mode) {
  if (drag || !state.editing || e.pointerType === "mouse" && e.button !== 0) return;
  const bandEl = cardEl.closest(".band");
  if (!bandEl) return;

  const ctx = {
    code: cardEl.dataset.code,
    from: JSON.parse(bandEl.dataset.path),
    cardEl, pid: e.pointerId, mode: mode || "instant",
    start: { x: e.clientX, y: e.clientY },
    started: false, ghost: null, mark: null, drop: null, hot: null, holdTimer: null,
  };
  drag = ctx;

  const detach = () => {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    window.removeEventListener("pointercancel", onUp);
    if (ctx.holdTimer) { clearTimeout(ctx.holdTimer); ctx.holdTimer = null; }
  };
  const onMove = (ev) => {
    if (ev.pointerId !== ctx.pid) return;
    if (!ctx.started) {
      const dist = Math.hypot(ev.clientX - ctx.start.x, ev.clientY - ctx.start.y);
      if (ctx.mode === "hold") {
        if (dist > HOLD_SLOP) { detach(); drag = null; }   // スクロールしたいだけ
        return;
      }
      if (ctx.mode === "move" && dist < 5) return;
      startGhost(ctx);
    }
    ev.preventDefault();
    moveGhost(ctx, ev);
  };
  const onUp = (ev) => {
    if (ev.pointerId !== ctx.pid) return;
    detach();
    if (ctx.started) finishDrag(ctx);
    drag = null;
  };
  window.addEventListener("pointermove", onMove, { passive: false });
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);

  if (ctx.mode === "instant") {
    e.preventDefault();
    startGhost(ctx);
    moveGhost(ctx, e);
  } else if (ctx.mode === "hold") {
    ctx.holdTimer = setTimeout(() => {
      ctx.holdTimer = null;
      if (drag !== ctx || ctx.started) return;
      startGhost(ctx);
      moveGhost(ctx, { clientX: ctx.start.x, clientY: ctx.start.y });
      if (navigator.vibrate) navigator.vibrate(15);   // 掴めたことを指に返す
    }, HOLD_MS);
  }
}

/* 並べ替えができない状態のときに、無言で何も起きないと理由が分からないので
   長押ししたら理由を出す。 */
let toastTimer = null;
function toast(msg) {
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.className = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

function armDragHint(e, cardEl) {
  const t = setTimeout(() => {
    if (!state.editing) toast("並べ替えるには、右上の「Googleでログイン」が必要です");
    else if (state.scope !== "folder") toast("並べ替えは「範囲: フォルダ内」の表示でできます");
    else if (state.sortKey !== "reg") toast("並べ替えは「並び: 登録順」の表示でできます");
  }, 450);
  const off = () => {
    clearTimeout(t);
    window.removeEventListener("pointerup", off);
    window.removeEventListener("pointercancel", off);
    window.removeEventListener("pointermove", onMove);
  };
  const onMove = (ev) => {
    if (Math.hypot(ev.clientX - e.clientX, ev.clientY - e.clientY) > HOLD_SLOP) off();
  };
  window.addEventListener("pointerup", off);
  window.addEventListener("pointercancel", off);
  window.addEventListener("pointermove", onMove, { passive: true });
}

function startGhost(ctx) {
  ctx.started = true;
  const r = ctx.cardEl.getBoundingClientRect();
  const g = ctx.cardEl.cloneNode(true);
  g.classList.add("drag-ghost");
  g.classList.remove("drag-src");
  g.style.width = r.width + "px";
  g.style.height = r.height + "px";
  g.style.left = "0px";
  g.style.top = "0px";
  ctx.offX = ctx.start.x - r.left;
  ctx.offY = ctx.start.y - r.top;
  document.body.appendChild(g);
  ctx.ghost = g;
  ctx.cardEl.classList.add("drag-src");
  document.body.style.userSelect = "none";
  ctx.lastX = ctx.start.x;
  ctx.lastY = ctx.start.y;
  startAutoScroll(ctx);
}

function moveGhost(ctx, ev) {
  ctx.lastX = ev.clientX;
  ctx.lastY = ev.clientY;
  ctx.ghost.style.transform = "translate(" + (ev.clientX - ctx.offX) + "px," + (ev.clientY - ctx.offY) + "px) rotate(1.5deg)";
  updateDrop(ctx);
}

/** 画面端で押さえている間、rAFで滑らかに自動スクロールし続ける。
 *  ポインタが動かなくなると pointermove が来ないため、ここで面倒を見る。 */
function startAutoScroll(ctx) {
  const EDGE = 90, MAXV = 42;
  const step = () => {
    if (!drag || drag !== ctx) return;
    const y = ctx.lastY;
    let v = 0;
    if (y < EDGE) v = -(1 - y / EDGE);
    else if (y > window.innerHeight - EDGE) v = 1 - (window.innerHeight - y) / EDGE;
    if (v) {
      const before = window.scrollY;
      window.scrollBy(0, Math.sign(v) * (6 + Math.abs(v) * MAXV));
      if (window.scrollY !== before) updateDrop(ctx);   // 紙が動いた分だけ判定し直す
    }
    ctx.raf = requestAnimationFrame(step);
  };
  ctx.raf = requestAnimationFrame(step);
}

function updateDrop(ctx) {
  const drop = resolveDrop(ctx.lastX, ctx.lastY);
  ctx.drop = drop;
  if (ctx.hot && (!drop || ctx.hot !== drop.el)) { ctx.hot.classList.remove("drop-in"); ctx.hot = null; }
  clearMark(ctx);
  if (!drop) return;
  if (drop.kind === "grid") {
    const cards = [...drop.grid.querySelectorAll(".card:not(.drag-src)")];
    const mark = document.createElement("div");
    mark.className = "drop-mark";
    drop.grid.appendChild(mark);
    const gr = drop.grid.getBoundingClientRect();
    const ref = cards[drop.index];
    if (ref) {
      const r = ref.getBoundingClientRect();
      mark.style.left = (r.left - gr.left - 5) + "px";
      mark.style.top = (r.top - gr.top) + "px";
      mark.style.height = r.height + "px";
    } else if (cards.length) {
      const r = cards[cards.length - 1].getBoundingClientRect();
      mark.style.left = (r.right - gr.left + 2) + "px";
      mark.style.top = (r.top - gr.top) + "px";
      mark.style.height = r.height + "px";
    } else {
      mark.style.left = "4px";
      mark.style.top = "4px";
      mark.style.height = "44px";
    }
    ctx.mark = mark;
  } else if (ctx.hot !== drop.el) {
    drop.el.classList.add("drop-in");
    ctx.hot = drop.el;
  }
}

function clearMark(ctx) {
  if (ctx.mark) { ctx.mark.remove(); ctx.mark = null; }
}

function resolveDrop(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;

  const listBtn = el.closest("#listSeg button");
  if (listBtn) {
    const i = +listBtn.dataset.i;
    return i === state.listIdx ? null : { kind: "list", listIdx: i, el: listBtn };
  }
  const grid = el.closest(".cards");
  if (grid) {
    const bandEl = grid.closest(".band");
    if (!bandEl) return null;
    const cards = [...grid.querySelectorAll(".card:not(.drag-src)")];
    let index = cards.length;
    for (let i = 0; i < cards.length; i++) {
      const r = cards[i].getBoundingClientRect();
      if (y < r.top) { index = i; break; }
      if (y <= r.bottom && x < r.left + r.width / 2) { index = i; break; }
    }
    return { kind: "grid", path: JSON.parse(bandEl.dataset.path), grid, index, el: grid };
  }
  // フォルダ見出しは sticky で常に見えるので、遠くのフォルダへ入れる近道になる
  const label = el.closest(".band-label");
  if (label) {
    const bandEl = label.closest(".band");
    if (!bandEl) return null;
    return { kind: "band", path: JSON.parse(bandEl.dataset.path), el: label };
  }
  const body = el.closest(".band-body");
  if (body) {
    const bandEl = body.closest(".band");
    if (!bandEl) return null;
    return { kind: "band", path: JSON.parse(bandEl.dataset.path), el: body };
  }
  return null;
}

function finishDrag(ctx) {
  if (ctx.raf) cancelAnimationFrame(ctx.raf);
  clearMark(ctx);
  if (ctx.hot) ctx.hot.classList.remove("drop-in");
  ctx.ghost.remove();
  ctx.cardEl.classList.remove("drag-src");
  document.body.style.userSelect = "";
  justDragged = true;
  setTimeout(() => { justDragged = false; }, 60);

  const d = ctx.drop;
  if (!d) return;
  const moved = d.kind === "list"
    ? applyMove(ctx.from, ctx.code, d.listIdx, [], null)
    : applyMove(ctx.from, ctx.code, state.listIdx, d.path, d.kind === "grid" ? d.index : null);
  if (moved) commit();
}

/** 銘柄を移動する。index は「ドラッグ中のカードを除いた並び」の何番目に差し込むか。 */
function applyMove(fromPath, code, toListIdx, toPath, index) {
  const wl = state.watchlist;
  const src = nodeAt(wl.lists[state.listIdx], fromPath);
  const i = src.codes.indexOf(code);
  if (i < 0) return false;
  const dst = nodeAt(wl.lists[toListIdx], toPath);
  src.codes.splice(i, 1);
  if (src !== dst && dst.codes.includes(code)) return true;   // 移動先に既にあれば重複させない
  const at = index == null ? dst.codes.length : Math.max(0, Math.min(index, dst.codes.length));
  dst.codes.splice(at, 0, code);
  return true;
}

/* ============================ フォルダ / リスト操作 ============================ */
function flattenNode(n) {
  const out = (n.codes || []).slice();
  for (const f of n.folders || []) out.push(...flattenNode(f));
  return out;
}

function commit() {
  buildListSeg();
  render();
  scheduleSave();
}

function folderAction(act, path) {
  const list = curList();
  const node = nodeAt(list, path);
  if (act === "ren") {
    const name = prompt("フォルダ名", node.name);
    if (!name || !name.trim()) return;
    node.name = name.trim();
  } else if (act === "sub") {
    const name = prompt("サブフォルダ名");
    if (!name || !name.trim()) return;
    node.folders.push({ name: name.trim(), codes: [], folders: [] });
  } else if (act === "del") {
    const n = flattenNode(node).length;
    if (n && !confirm("「" + node.name + "」の " + n + " 銘柄を親へ移してフォルダを削除します。よろしいですか？")) return;
    const parent = nodeAt(list, path.slice(0, -1));
    parent.codes.push(...node.codes);
    parent.folders.push(...node.folders);
    parent.folders.splice(path[path.length - 1], 1);
  }
  commit();
}

function addFolder() {
  if (!state.watchlist) return;
  const name = prompt("フォルダ名");
  if (!name || !name.trim()) return;
  curList().folders.push({ name: name.trim(), codes: [], folders: [] });
  commit();
}

function addList() {
  const name = prompt("リスト名");
  if (!name || !name.trim()) return;
  if (!state.watchlist) state.watchlist = { version: 1, lists: [] };
  const wl = state.watchlist;
  wl.lists.push({ id: "list" + (wl.lists.length + 1), name: name.trim(), codes: [], folders: [] });
  state.listIdx = wl.lists.length - 1;
  $("#content").innerHTML = "";
  commit();
}

boot();
</script>
